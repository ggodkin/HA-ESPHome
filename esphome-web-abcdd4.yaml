esphome:
  name: esphome-greenhouse
  friendly_name: ESPHome Greenhouse
  on_boot:
    priority: -10
    then:
      - delay: 15s
      - script.execute: sensor_loop

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: light
  output_power: 17.0dBm
  reboot_timeout: 15min

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

web_server:
  port: 80
  version: 2

# Infrastructure
time:
  - platform: sntp
    id: sntp_time
    timezone: "MST7MDT,M3.2.0,M11.1.0"

one_wire:
  - platform: gpio
    pin: GPIO4
    id: dallas_bus

# Control Interface
number:
  - platform: template
    name: "Update Interval"
    id: temp_interval
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    unit_of_measurement: "min"
    optimistic: true
    set_action:
      then:
        - script.execute: sensor_loop

text_sensor:
  - platform: template
    name: "Clock"
    id: device_time
    icon: "mdi:clock-outline"
    update_interval: 60s
    lambda: |-
      return id(sntp_time).now().strftime("%H:%M");

sensor:
  # --- Background ADC Sampling (Internal) ---
  # These sample every 10s to build a stable moving average[cite: 1, 2]
  - platform: adc
    pin: GPIO34
    id: batt_12v_raw
    internal: true
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 5.545
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: adc
    pin: GPIO35
    id: batt_ctrl_raw
    internal: true
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  # --- Public Sensors (Updated via script) ---
  - platform: template
    name: "12V System Voltage"
    id: batt_12v
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    update_interval: never
    lambda: 'return id(batt_12v_raw).state;'
    on_value:
      then:
        - if:
            # SHUTDOWN: Triggered at 11.1V[cite: 1, 2]
            condition:
              lambda: 'return x < 11.1;' 
            then:
              - switch.turn_off: GHSw1 
              - switch.turn_off: GHSw2
              - logger.log: "CRITICAL: 12V Battery Low (< 11.1V). Load Shedding Active."
        - if:
            # HYSTERESIS RECOVERY: Logic considered "Safe" only when voltage recovers
            condition:
              lambda: 'return x > 12.2;' 
            then:
              - logger.log: "INFO: 12V Battery recovered above 12.2V."

  - platform: template
    name: "Controller Battery Voltage"
    id: batt_ctrl
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    update_interval: never
    lambda: 'return id(batt_ctrl_raw).state;'
    on_value:
      then:
        - if:
            # SHUTDOWN: Triggered at 3.8V[cite: 1, 2]
            condition:
              lambda: 'return x < 3.8;' 
            then:
              - switch.turn_off: GHSw1
              - switch.turn_off: GHSw2
              - logger.log: "CRITICAL: Controller Battery Low (< 3.8V)."
        - if:
            # HYSTERESIS RECOVERY
            condition:
              lambda: 'return x > 4.0;' 
            then:
              - logger.log: "INFO: Controller Battery recovered above 4.0V."

  - platform: internal_temperature
    name: "Greenhouse Controller Internal Temp"
    id: internal_temp
    update_interval: never

  - platform: wifi_signal
    name: "Greenhouse WiFi Signal"
    id: wifi_rssi
    update_interval: never

  - platform: uptime
    name: "Greenhouse Uptime"

  - platform: dallas_temp
    name: "Greenhouse Temp 1"
    index: 0
    id: temp_sensor_1
    update_interval: never

  - platform: dallas_temp
    name: "Greenhouse Temp 2"
    index: 1
    id: temp_sensor_2
    update_interval: never

switch:
  - platform: gpio
    name: "Greenhouse Mister"
    pin: GPIO13
    id: GHSw1
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Greenhouse Fan"
    pin: GPIO14
    id: GHSw2
    restore_mode: ALWAYS_OFF

script:
  - id: sensor_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            # Manually refresh sensors for the UI[cite: 1]
            - component.update: batt_12v
            - component.update: batt_ctrl
            - component.update: internal_temp
            - component.update: wifi_rssi
            - component.update: temp_sensor_1
            - component.update: temp_sensor_2
            - logger.log: "Greenhouse sensors updated via loop."
            # Delay based on the 'Update Interval' slider[cite: 1, 2]
            - delay: !lambda 'return id(temp_interval).state * 60000;'