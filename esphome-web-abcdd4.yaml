esphome:
  name: esphome-greenhouse
  friendly_name: ESPHome Greenhouse
  on_boot:
    priority: -10
    then:
      - delay: 10s
      # The staggered start: increase power only after system stabilizes
      - script.execute: sensor_loop

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      sram1_as_iram: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Connection optimizations to prevent brownouts
  fast_connect: true
  power_save_mode: light
  output_power: 17.0dBm # Balanced for -79dBm signal
  
  # Static IP cuts radio "on-time" during boot by seconds
  manual_ip:
    static_ip: 10.0.8.200
    gateway: 10.0.8.1
    subnet: 255.255.255.0

  # Prevents infinite reboot loops if WiFi is lost
  reboot_timeout: 15min

sensor:
  # 12V Battery Monitoring (3S Li-ion)
  - platform: adc
    pin: GPIO34
    name: "12V System Voltage"
    id: batt_12v
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 5.545
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x < 11.1;' 
            then:
              - switch.turn_off: GHSw1 
              - switch.turn_off: GHSw2
              - logger.log: "CRITICAL: 12V Battery Low"

  # 1-Cell Controller Battery Monitoring
  - platform: adc
    pin: GPIO35
    name: "Controller Battery Voltage"
    id: batt_ctrl
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x < 3.8;' 
            then:
              - switch.turn_off: GHSw1
              - switch.turn_off: GHSw2
              - logger.log: "CRITICAL: Controller Battery Low"

  # Health and Environment Metrics
  - platform: wifi_signal
    name: "Greenhouse WiFi Signal"
    id: wifi_rssi
    update_interval: 60s

  - platform: uptime
    name: "Greenhouse Uptime"

  - platform: internal_temperature
    name: "ESP32 Internal Temp"

  - platform: dallas_temp
    name: "Greenhouse Temp 1"
    index: 0
    id: temp_sensor_1
    update_interval: never
  - platform: dallas_temp
    name: "Greenhouse Temp 2"
    index: 1
    id: temp_sensor_2
    update_interval: never

# Infrastructure
time:
  - platform: sntp
    id: sntp_time
    timezone: "MST7MDT,M3.2.0,M11.1.0"

one_wire:
  - platform: gpio
    pin: GPIO4
    id: dallas_bus

# Control Interface
number:
  - platform: template
    name: "Update Interval"
    id: temp_interval
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    unit_of_measurement: "min"
    optimistic: true
    set_action:
      then:
        - script.execute: sensor_loop

text_sensor:
  - platform: template
    name: "Clock"
    id: device_time
    icon: "mdi:clock-outline"
    update_interval: 60s
    lambda: |-
      return id(sntp_time).now().strftime("%H:%M");

switch:
  - platform: gpio
    name: "Greenhouse Mister"
    pin: GPIO13
    id: GHSw1
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Greenhouse Fan"
    pin: GPIO14
    id: GHSw2
    restore_mode: ALWAYS_OFF

script:
  - id: sensor_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - component.update: temp_sensor_1
            - component.update: temp_sensor_2
            - delay: !lambda 'return id(temp_interval).state * 60000;'

web_server:
  port: 80
  version: 2

logger:
api:
      encryption:
        key: !secret api_encryption_key
ota:
  - platform: esphome