substitutions:
  # Update Interval Default
  initial_update_interval: "5"
  
  # 12V System Thresholds[cite: 1, 2]
  batt_12v_critical: "11.1"
  batt_12v_recovery: "12.2"
  
  # Controller Battery Thresholds (Based on provided capacity table)[cite: 1, 2]
  # 30% Capacity = 3.22V (Shutdown)
  # 60% Capacity = 3.27V (Deep Sleep)
  batt_ctrl_shutdown: "3.22"
  batt_ctrl_sleep: "3.27"
  
  # GPIO Pins[cite: 1, 2]
  pin_one_wire: GPIO4
  pin_batt_12v: GPIO34
  pin_batt_ctrl: GPIO35
  pin_mister: GPIO13
  pin_fan: GPIO14

esphome:
  name: esphome-greenhouse
  friendly_name: ESPHome Greenhouse
  on_boot:
    priority: -10
    then:
      - delay: 15s
      - script.execute: sensor_loop

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

deep_sleep:
  id: greenhouse_sleep

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: light
  output_power: 17.0dBm
  reboot_timeout: 15min

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

web_server:
  port: 80
  version: 2

time:
  - platform: sntp
    id: sntp_time
    timezone: "MST7MDT,M3.2.0,M11.1.0"

one_wire:
  - platform: gpio
    pin: ${pin_one_wire}
    id: dallas_bus

# Control Interface
number:
  - platform: template
    name: "Update Interval"
    id: temp_interval
    min_value: 1
    max_value: 60
    step: 1
    initial_value: ${initial_update_interval}
    unit_of_measurement: "min"
    optimistic: true
    set_action:
      then:
        - script.execute: sensor_loop

text_sensor:
  - platform: template
    name: "Clock"
    id: device_time
    icon: "mdi:clock-outline"
    update_interval: 60s
    lambda: |-
      return id(sntp_time).now().strftime("%H:%M");

sensor:
  # Background ADC Sampling[cite: 1, 2]
  - platform: adc
    pin: ${pin_batt_12v}
    id: batt_12v_raw
    internal: true
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 5.545
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: adc
    pin: ${pin_batt_ctrl}
    id: batt_ctrl_raw
    internal: true
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  # 12V System Logic[cite: 1, 2]
  - platform: template
    name: "12V System Voltage"
    id: batt_12v
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    update_interval: never
    lambda: 'return id(batt_12v_raw).state;'
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x < ${batt_12v_critical};' 
            then:
              - switch.turn_off: GHSw1 
              - switch.turn_off: GHSw2
              - logger.log: "CRITICAL: 12V Battery Low."
        - if:
            condition:
              lambda: 'return x > ${batt_12v_recovery};' 
            then:
              - logger.log: "INFO: 12V Battery Healthy."

# Controller Battery Voltage with Specific Capacity Mapping
  - platform: template
    name: "Controller Battery Voltage"
    id: batt_ctrl
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    update_interval: never
    lambda: 'return id(batt_ctrl_raw).state;'
    on_value:
      then:
        # Fixed Diagnostic Log
        - logger.log:
            format: "Battery Logic Check: Voltage is %.3fV"
            args: 
              - 'x'
        - if:
            # Shutdown Logic (<30%)
            condition:
              lambda: 'return x < ${batt_ctrl_shutdown};' 
            then:
              - switch.turn_off: GHSw1
              - switch.turn_off: GHSw2
              - logger.log: "CRITICAL: Controller Battery < 30%."
        - if:
            # Deep Sleep Logic (<60%)[cite: 1, 2]
            condition:
              lambda: 'return x >= ${batt_ctrl_shutdown} && x < ${batt_ctrl_sleep};'
            then:
              - logger.log:
                  format: "LOW POWER: %.3fV is below sleep threshold %.2fV. Sleeping now."
                  args:
                    - 'x'
                    - ${batt_ctrl_sleep}
              - deep_sleep.enter:
                  id: greenhouse_sleep
                  sleep_duration: !lambda 'return id(temp_interval).state * 60000;'
                                    
  - platform: internal_temperature
    name: "Greenhouse Controller Internal Temp"
    id: internal_temp
    update_interval: never

  - platform: wifi_signal
    name: "Greenhouse WiFi Signal"
    id: wifi_rssi
    update_interval: never

  - platform: uptime
    name: "Greenhouse Uptime"

  - platform: dallas_temp
    name: "Greenhouse Temp 1"
    index: 0
    id: temp_sensor_1
    update_interval: never

  - platform: dallas_temp
    name: "Greenhouse Temp 2"
    index: 1
    id: temp_sensor_2
    update_interval: never

switch:
  - platform: gpio
    name: "Greenhouse Mister"
    pin: ${pin_mister}
    id: GHSw1
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Greenhouse Fan"
    pin: ${pin_fan}
    id: GHSw2
    restore_mode: ALWAYS_OFF

script:
  - id: sensor_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - component.update: batt_12v
            - component.update: batt_ctrl
            - component.update: internal_temp
            - component.update: wifi_rssi
            - component.update: temp_sensor_1
            - component.update: temp_sensor_2
            - logger.log: "Greenhouse sensors updated via loop."
            - delay: !lambda 'return id(temp_interval).state * 60000;'