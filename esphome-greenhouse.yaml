esphome:
  name: esphome-greenhouse
  friendly_name: ESPHome Greenhouse
  includes:
    - "<esp_chip_info.h>" # Note the angle brackets and quotes
  on_boot:
    priority: -10
    then:
      - delay: 15s
      - script.execute: sensor_loop

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: light
  output_power: 17.0dBm
  reboot_timeout: 15min

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

web_server:
  port: 80
  version: 2

deep_sleep:
  id: deep_sleep_control

# Infrastructure
time:
  - platform: sntp
    id: sntp_time
    timezone: "MST7MDT,M3.2.0,M11.1.0"

one_wire:
  - platform: gpio
    pin: GPIO4
    id: dallas_bus

# Control Interface
number:
  - platform: template
    name: "Update Interval"
    id: temp_interval
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    unit_of_measurement: "min"
    optimistic: true
    set_action:
      then:
        - script.execute: sensor_loop

text_sensor:
  - platform: template
    name: "Clock"
    id: device_time
    icon: "mdi:clock-outline"
    update_interval: 60s
    lambda: |-
      return id(sntp_time).now().strftime("%H:%M");

  - platform: template
    name: "Chip Revision"
    id: chip_rev
    lambda: |-
      esp_chip_info_t chip_info;
      esp_chip_info(&chip_info);
      return str_sprintf("Rev %d", chip_info.revision); // Removed the curly braces

sensor:
  # --- Background ADC Sampling (Internal) ---
  - platform: adc
    pin: GPIO34
    id: batt_12v_raw
    internal: true
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 5.545
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: adc
    pin: GPIO35
    id: batt_ctrl_raw
    internal: true
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  # --- 12V System Voltage (Equipment Safety) ---
  - platform: template
    name: "12V System Voltage"
    id: batt_12v
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    update_interval: never
    lambda: 'return id(batt_12v_raw).state;'
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x < 11.1;' 
            then:
              - switch.turn_off: GHSw1 
              - switch.turn_off: GHSw2
              - logger.log: "CRITICAL: 12V Battery Low - Disabling Load"

  # --- Controller Battery Voltage ---
  - platform: template
    name: "Controller Battery Voltage"
    id: batt_ctrl_volts
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    update_interval: never
    lambda: 'return id(batt_ctrl_raw).state;'

  # --- Controller Battery Capacity ---
  - platform: template
    name: "Controller Battery Capacity"
    id: batt_ctrl_pct
    unit_of_measurement: "%"
    device_class: "battery"
    update_interval: never
    lambda: |-
      float voltage = id(batt_ctrl_raw).state;
      float pct = (voltage - 3.3) / (4.2 - 3.3) * 100.0;
      if (pct > 100) return 100.0;
      if (pct < 0) return 0.0;
      return pct;
    on_value:
      then:
        # Load Shedding at 60%
        - if:
            condition:
              lambda: 'return x < 60.0;'
            then:
              - switch.turn_off: GHSw1
              - switch.turn_off: GHSw2
              - logger.log: "ADVISORY: Controller Battery < 60%. Peripherals disabled."
        # Deep Sleep at 30%
        - if:
            condition:
              lambda: 'return x < 30.0;'
            then:
              - logger.log: "CRITICAL: Controller Battery < 30%. Deep Sleep 4h."
              - delay: 5s 
              - deep_sleep.enter: 
                  id: deep_sleep_control
                  sleep_duration: 4h
                  
  - platform: internal_temperature
    name: "Greenhouse Controller Internal Temp"
    id: internal_temp
    update_interval: never

  - platform: wifi_signal
    name: "Greenhouse WiFi Signal"
    id: wifi_rssi
    update_interval: never

  - platform: uptime
    name: "Greenhouse Uptime"

  - platform: dallas_temp
    name: "Greenhouse Temp 1"
    index: 0
    id: temp_sensor_1
    update_interval: never

  - platform: dallas_temp
    name: "Greenhouse Temp 2"
    index: 1
    id: temp_sensor_2
    update_interval: never

switch:
  - platform: gpio
    name: "Greenhouse Mister"
    pin: GPIO13
    id: GHSw1
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "Greenhouse Fan"
    pin: GPIO14
    id: GHSw2
    restore_mode: ALWAYS_OFF

script:
  - id: sensor_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - component.update: batt_12v
            - component.update: batt_ctrl_volts # Added this update
            - component.update: batt_ctrl_pct
            - component.update: internal_temp
            - component.update: wifi_rssi
            - component.update: temp_sensor_1
            - component.update: temp_sensor_2
            - logger.log: "Greenhouse loop updated."
            - delay: !lambda 'return id(temp_interval).state * 60000;'