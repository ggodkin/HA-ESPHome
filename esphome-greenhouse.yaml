esphome:
  name: esphome-greenhouse
  friendly_name: ESPHome Greenhouse
  includes:
    - "<esp_chip_info.h>"

  on_boot:
    priority: -10
    then:
      - delay: ${boot_delay}
      - script.execute: force_logic_update

# ============================
# 🔧 USER CONFIGURABLE CONSTANTS
# ============================

substitutions:
  default_update_interval_min: "5"
  onewire_pin: GPIO4
  adc_12v_pin: GPIO34
  adc_ctrl_pin: GPIO35
  mister_pin: GPIO13
  fan_pin: GPIO14
  voltage_multiplier_12v: "5.545"
  voltage_multiplier_ctrl: "2.0"
  
  # Battery Thresholds
  low_12v_shutdown: "11.1"
  ctrl_batt_load_disable_pct: "60.0"
  ctrl_batt_sleep_pct: "30.0"
  ctrl_batt_restore_pct: "65.0"
  
  ctrl_battery_full_v: "4.2"
  ctrl_battery_empty_v: "3.3"
  
  mister_on_temp: "75.0"
  mister_off_temp: "73.0"
  fan_on_temp: "80.0"
  fan_off_temp: "78.0"
  wifi_output_power: "17.0dBm"
  boot_delay: "15s"

# ============================
# CORE CONFIG
# ============================

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: light
  output_power: ${wifi_output_power}
  reboot_timeout: 15min

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:
  level: DEBUG

web_server:
  port: 80
  version: 2

time:
  - platform: sntp
    id: sntp_time
    timezone: "MST7MDT,M3.2.0,M11.1.0"

deep_sleep:
  id: greenhouse_sleep
  sleep_duration: 4h

one_wire:
  - platform: gpio
    pin: ${onewire_pin}

globals:
  - id: loads_enabled
    type: bool
    restore_value: true
    initial_value: "true"

# ============================
# SENSORS & CONTROLS
# ============================

number:
  - platform: template
    name: "Update Interval"
    id: temp_interval
    min_value: 1
    max_value: 60
    step: 1
    initial_value: ${default_update_interval_min}
    unit_of_measurement: "min"
    optimistic: true
    set_action:
      then:
        - script.stop: force_logic_update
        - script.execute: force_logic_update

sensor:
  - platform: adc
    pin: ${adc_12v_pin}
    id: batt_12v_raw
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: ${voltage_multiplier_12v}

  - platform: adc
    pin: ${adc_ctrl_pin}
    id: batt_ctrl_raw
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: ${voltage_multiplier_ctrl}
      - median:
          window_size: 7
          send_every: 1

  - platform: template
    name: "12V System Voltage"
    id: batt_12v
    unit_of_measurement: "V"
    device_class: "voltage"
    lambda: 'return id(batt_12v_raw).state;'

  - platform: template
    name: "Control Battery Voltage"
    id: batt_ctrl_v
    unit_of_measurement: "V"
    device_class: "voltage"
    lambda: 'return id(batt_ctrl_raw).state;'

  - platform: template
    name: "Controller Battery Capacity"
    id: batt_ctrl_pct
    unit_of_measurement: "%"
    device_class: "battery"
    lambda: |-
      if (!id(batt_ctrl_raw).has_state()) return NAN;
      float v = id(batt_ctrl_raw).state;
      float pct = (v - ${ctrl_battery_empty_v}) / (${ctrl_battery_full_v} - ${ctrl_battery_empty_v}) * 100.0;
      return clamp(pct, 0.0f, 100.0f);

  - platform: dallas_temp
    name: "Greenhouse Air Temperature"
    id: greenhouse_temp
    index: 0
    update_interval: never
    filters:
      - lambda: return x * 1.8 + 32.0;
    unit_of_measurement: "°F"

  - platform: uptime
    name: "Greenhouse Uptime"

switch:
  - platform: gpio
    name: "Greenhouse Mister"
    pin: ${mister_pin}
    id: GHSw1
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Greenhouse Fan"
    pin: ${fan_pin}
    id: GHSw2
    restore_mode: ALWAYS_OFF

script:
  - id: force_logic_update
    mode: restart
    then:
      - logger.log: "Logic cycle started..."
      
      # Step 1: Physical Data Collection
      - component.update: batt_12v_raw
      - component.update: batt_ctrl_raw
      - component.update: greenhouse_temp
      - delay: 1s 

      # Step 2: UI Refresh
      - component.update: batt_12v
      - component.update: batt_ctrl_v
      - component.update: batt_ctrl_pct

      # Step 3: Battery Management Logic
      - if:
          condition:
            # TIER 3: CRITICAL (Control Batt < 30%) -> Hard Sleep
            lambda: 'return id(batt_ctrl_pct).state < ${ctrl_batt_sleep_pct};'
          then:
            - logger.log: "CRITICAL CONTROL BATTERY: Shutting down loads and sleeping."
            - switch.turn_off: GHSw1
            - switch.turn_off: GHSw2
            - delay: 2s 
            - deep_sleep.enter: greenhouse_sleep

      - if:
          condition:
            # TIER 2: LOW POWER (12V < 11.1V OR Control Batt < 60%) -> Soft Shutdown
            lambda: |-
              return id(batt_12v_raw).state < ${low_12v_shutdown} ||
                     id(batt_ctrl_pct).state < ${ctrl_batt_load_disable_pct};
          then:
            - if:
                condition: { lambda: 'return id(loads_enabled);' }
                then: { logger.log: "LOW POWER MODE: Forcing loads OFF." }
            - switch.turn_off: GHSw1
            - switch.turn_off: GHSw2
            - globals.set: { id: loads_enabled, value: "false" }
          else:
            - if:
                # TIER 1: NORMAL OPERATION Recovery (> 65%)
                condition: { lambda: 'return id(batt_ctrl_pct).state > ${ctrl_batt_restore_pct};' }
                then:
                  - if:
                      condition: { lambda: 'return !id(loads_enabled);' }
                      then: { logger.log: "NORMAL POWER: Enabling automation." }
                  - globals.set: { id: loads_enabled, value: "true" }

      # Step 4: Temperature Control (Only if Battery OK)
      - if:
          condition: { lambda: 'return id(loads_enabled) && id(greenhouse_temp).has_state();' }
          then:
            - if:
                condition: { lambda: 'return id(greenhouse_temp).state >= ${fan_on_temp};' }
                then: { switch.turn_on: GHSw2 }
                else:
                  - if: { condition: { lambda: 'return id(greenhouse_temp).state <= ${fan_off_temp};' }, then: { switch.turn_off: GHSw2 } }
            
            - if:
                condition: { lambda: 'return id(greenhouse_temp).state >= ${mister_on_temp};' }
                then: { switch.turn_on: GHSw1 }
                else:
                  - if: { condition: { lambda: 'return id(greenhouse_temp).state <= ${mister_off_temp};' }, then: { switch.turn_off: GHSw1 } }

      - logger.log: "Logic cycle finished."

      # Step 5: Schedule next iteration
      - delay: !lambda |-
          float min = id(temp_interval).state;
          if (std::isnan(min) || min < 1.0) min = 5.0;
          return (uint32_t)(min * 60000);
      - script.execute: force_logic_update